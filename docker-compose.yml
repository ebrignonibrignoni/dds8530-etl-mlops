# Local monitoring stack: model API + Prometheus (scrapes /metrics) + Grafana (dashboards)
services:
  api:
    build: .
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
